{% extends "base.html" %}

{% block title %}Ustawienia{% endblock %}

{% block content %}
    <h1>Ustawienia</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="status-message {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="post">
        <div class="form-group">
            <label for="sources">Źródła RSS (jeden URL na linię)</label>
            <textarea id="sources" name="sources" class="form-control" rows="15">{{ sources_content }}</textarea>
        </div>
        <button type="submit" class="btn">Zapisz zmiany</button>
    </form>
{% endblock %}
